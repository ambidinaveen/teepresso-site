{% extends 'base.html' %}
{% block title %}Login — {{ BRAND }}{% endblock %}
{% block content %}
<div class="container-tp">
  <div class="auth-card card-tp p-4">
    <div class="text-center mb-3"><div class="tp-logo mx-auto mb-2">T</div><h4 class="fw-bold">Welcome back</h4><p class="text-muted small">Login to your {{ BRAND }} account</p></div>
    <form method="post">{% csrf_token %}
      <label class="small fw-semibold">Email or Mobile</label>{{ form.identifier }}
      <label class="small fw-semibold mt-3">Password</label>{{ form.password }}
      <div class="text-end mt-1"><a href="{% url 'accounts:forgot' %}" class="small">Forgot password?</a></div>
      <button class="btn btn-grad w-100 mt-3">Login</button>
    </form>
    <p class="text-center small text-muted mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
