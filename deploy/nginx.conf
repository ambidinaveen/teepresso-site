# Teepresso — Nginx config for the Docker stack (docker-compose.yml mounts this
# at /etc/nginx/conf.d/default.conf). It reverse-proxies to the `web` (Gunicorn)
# container and serves static/media from shared volumes.
#
# For a bare-metal VPS instead (Gunicorn via systemd socket), swap proxy_pass for
#   proxy_pass http://unix:/run/teepresso.sock;
# and point the alias paths at /home/teepresso/teepresso_site/{staticfiles,media}.
# Add HTTPS with: sudo certbot --nginx

upstream teepresso_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;   # allow logo / design-file uploads

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://teepresso_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
